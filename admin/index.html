<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | ПРОСВЕТ</title>
    <!-- Виджет авторизации Netlify -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Точка входа в Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        // Явно указываем адрес сервера Netlify для работы на домене GitHub
        window.netlifyIdentity.setURL("https://stunning-dango-c3132b.netlify.app/");

        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }

      // Принудительно открываем окно логина при загрузке, если пользователь не авторизован
      document.addEventListener('DOMContentLoaded', () => {
        const user = netlifyIdentity.currentUser();
        if (!user) {
          netlifyIdentity.open();
        }
      });
    </script>
  </body>
</html>
