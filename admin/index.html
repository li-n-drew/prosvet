<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | ПРОСВЕТ</title>
    <!-- Виджет авторизации Netlify -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Точка входа в Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Инициализация виджета Netlify Identity
      if (window.netlifyIdentity) {
        // Указываем адрес сервера авторизации Netlify для работы на стороннем домене
        window.netlifyIdentity.setURL("https://stunning-dango-c3132b.netlify.app/");

        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
