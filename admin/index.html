<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРОСВЕТ | Профессиональная Админ-панель</title>
    <!-- Яндекс Карты для пикера -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=YOUR_API_KEY" type="text/javascript"></script>
    <style>
        :root {
            --primary: #2ea44f;
            --primary-hover: #2c974b;
            --danger: #cf222e;
            --bg: #f6f8fa;
            --text: #24292f;
            --border: #d0d7de;
            --white: #ffffff;
            --accent: #ffe066;
        }

        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }

        /* Header */
        header { background: #24292f; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; margin: 0; }

        /* Main Layout */
        .main { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        aside { width: 260px; border-right: 1px solid var(--border); background: var(--white); display: flex; flex-direction: column; }
        .nav-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid var(--border); transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover { background: #f3f4f6; }
        .nav-item.active { background: #e2e8f0; font-weight: 600; border-left: 4px solid var(--text); }
        .publish-area { padding: 20px; margin-top: auto; border-top: 1px solid var(--border); }

        /* Content Area */
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .view-container { max-width: 1000px; margin: 0 auto; }

        /* Forms & Preview Split */
        .editor-split { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }

        /* Cards */
        .item-card { background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .item-card:hover { border-color: #888; }

        /* Buttons */
        .btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; border: 1px solid var(--border); transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; border: none; width: 100%; }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        /* Form Elements */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }

        /* Map Picker */
        #map-picker { height: 250px; border: 1px solid var(--border); border-radius: 6px; margin-top: 10px; }

        /* Live Preview Styles (Simplified from main site) */
        .preview-box { background: #111; color: white; padding: 20px; border-radius: 8px; position: sticky; top: 20px; }
        .preview-label { font-size: 11px; text-transform: uppercase; opacity: 0.5; margin-bottom: 10px; display: block; }

        /* Event Preview */
        .ev-prev { background: #1a1a1a; padding: 15px; border-radius: 6px; border-left: 3px solid var(--accent); }
        .ev-prev .date { color: var(--accent); font-size: 12px; font-weight: bold; }
        .ev-prev h3 { margin: 5px 0; font-size: 16px; }

        /* Gallery Preview */
        .gal-prev img { width: 100%; border-radius: 4px; object-fit: cover; height: 150px; }

        /* Login Overlay */
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }

        .hidden { display: none !important; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #ccc; margin-right: 5px; }
        .status-changed { background: #f0ad4e; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="width: 350px; background: white; padding: 30px; border-radius: 8px; border: 1px solid var(--border);">
        <h2 style="margin-top:0">Вход в Админку</h2>
        <p style="font-size: 13px; color: #666;">Введите ваш GitHub Token для управления репозиторием li-n-drew/prosvet</p>
        <input type="password" id="gh-token" placeholder="ghp_xxxx..." style="width:100%; padding:10px; margin-bottom:20px; border:1px solid var(--border); border-radius:4px;">
        <button class="btn btn-primary" onclick="login()">Войти</button>
    </div>
</div>

<header>
    <h1>ПРОСВЕТ | Управление контентом</h1>
    <div id="user-info" style="font-size: 13px; opacity: 0.8;"></div>
</header>

<div class="main">
    <aside>
        <div class="nav-item active" onclick="switchSection('events')">📅 Расписание</div>
        <div class="nav-item" onclick="switchSection('locations')">📍 Локации (Карта)</div>
        <div class="nav-item" onclick="switchSection('gallery')">🖼️ Галерея & Видео</div>
        <div class="nav-item" onclick="switchSection('settings')">⚙️ Настройки сайта</div>

        <div class="publish-area">
            <button id="publish-btn" class="btn btn-primary" onclick="publishAll()">🚀 Опубликовать всё</button>
            <div id="save-status" style="font-size: 11px; margin-top: 10px; text-align: center; color: #666;">
                Все изменения сохранены локально
            </div>
        </div>
    </aside>

    <div class="content">
        <div class="view-container">
            <!-- List View -->
            <div id="list-view">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 id="view-title" style="margin:0">События</h2>
                    <button class="btn" onclick="addNew()">+ Добавить элемент</button>
                </div>
                <div id="items-list"></div>
            </div>

            <!-- Editor View -->
            <div id="editor-view" class="hidden">
                <div class="editor-split">
                    <div class="editor-form">
                        <h2 id="editor-title">Редактирование</h2>
                        <div id="fields-container"></div>

                        <!-- Специальные блоки -->
                        <div id="map-block" class="hidden">
                            <label>Кликните на место на карте:</label>
                            <div id="map-picker"></div>
                        </div>

                        <div id="upload-block" class="hidden" style="margin-top:20px; padding:15px; background:#f0f7ff; border-radius:6px;">
                            <label>Загрузить изображение на GitHub:</label>
                            <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(this)">
                            <div id="upload-status" style="font-size:12px; margin-top:5px; color:#005cbf;"></div>
                        </div>

                        <div style="margin-top:20px; display:flex; gap:10px;">
                            <button class="btn btn-primary" onclick="commitItem()">Сохранить в список</button>
                            <button class="btn" onclick="cancelEdit()">Отмена</button>
                        </div>
                    </div>

                    <div class="editor-preview">
                        <span class="preview-label">Предпросмотр на сайте</span>
                        <div id="live-preview" class="preview-box">
                            <!-- Live HTML will be here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings View -->
            <div id="settings-view" class="hidden">
                <h2>Общие настройки</h2>
                <div id="settings-fields"></div>
                <button class="btn btn-primary" style="margin-top:20px" onclick="commitSettings()">Применить настройки</button>
            </div>
        </div>
    </div>
</div>

<script>
    const REPO = 'li-n-drew/prosvet';
    const SECTIONS = {
        events: { title: 'Расписание', path: 'data/events.json' },
        locations: { title: 'Локации', path: 'data/locations.json' },
        gallery: { title: 'Галерея', path: 'data/gallery.json' },
        settings: { title: 'Настройки', path: 'data/settings.json' }
    };

    let currentSection = 'events';
    let dataCache = {}; // { events: { items: [], sha: '' }, ... }
    let editIndex = -1;
    let mapPicker = null;
    let pickerMarker = null;

    // --- Auth ---
    function login() {
        const token = document.getElementById('gh-token').value.trim();
        if(!token) return alert('Введите токен!');
        localStorage.setItem('gh_token', token);
        init();
    }

    async function init() {
        const token = localStorage.getItem('gh_token');
        if(!token) return;
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('user-info').innerText = 'Авторизован в ' + REPO;

        await switchSection('events');
    }

    // --- Data Loading ---
    async function switchSection(key) {
        currentSection = key;
        updateNav();
        showView('list');

        if(!dataCache[key]) {
            const token = localStorage.getItem('gh_token');
            if (!token) {
                showStatus('Ошибка: Отсутствует токен доступа. Войдите заново.', 'error');
                return;
            }

            showLoading(true);
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${SECTIONS[key].path}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Cache-Control': 'no-cache'
                    }
                });

                if (res.status === 401) throw new Error('Неверный токен (401). Проверьте его в настройках.');
                if (res.status === 404) throw new Error(`Файл не найден (404): ${SECTIONS[key].path}`);

                const json = await res.json();
                if (res.status !== 200) throw new Error(json.message || 'Ошибка API');

                const content = JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g, '')))));
                dataCache[key] = { items: content.items || content, sha: json.sha, original: content };
            } catch(e) {
                console.error('GitHub API Error:', e);
                showStatus('Ошибка загрузки: ' + e.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        renderList();
    }

    function renderList() {
        const container = document.getElementById('items-list');
        container.innerHTML = '';
        document.getElementById('view-title').innerText = SECTIONS[currentSection].title;

        if(currentSection === 'settings') {
            showView('settings');
            renderSettings();
            return;
        }

        const items = dataCache[currentSection].items;
        items.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'item-card';
            el.innerHTML = `
                <div>
                    <strong>${item.title || item.date || item.alt || 'Без названия'}</strong>
                    <div style="font-size:12px; color:#666">${item.address || item.src || ''}</div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="startEdit(${idx})">Правка</button>
                    <button class="btn btn-danger" onclick="removeItem(${idx})">Удалить</button>
                </div>
            `;
            container.appendChild(el);
        });
    }

    // --- Editing & Preview ---
    function addNew() {
        editIndex = -1;
        startEdit(null);
    }

    function startEdit(idx) {
        editIndex = idx;
        const item = idx !== null ? dataCache[currentSection].items[idx] : {};
        showView('editor');
        renderFields(item);
        updatePreview(item);

        // Показываем карту для локаций
        if(currentSection === 'locations') {
            document.getElementById('map-block').classList.remove('hidden');
            initMapPicker(item.lat || 59.93, item.lng || 30.31);
        } else {
            document.getElementById('map-block').classList.add('hidden');
        }

        // Показываем загрузку для галереи
        if(currentSection === 'gallery' || currentSection === 'settings') {
            document.getElementById('upload-block').classList.remove('hidden');
        } else {
            document.getElementById('upload-block').classList.add('hidden');
        }
    }

    function renderFields(item) {
        const container = document.getElementById('fields-container');
        container.innerHTML = '';

        const schema = {
            events: [
                { label: 'Дата', key: 'date', type: 'text' },
                { label: 'Заголовок', key: 'title', type: 'text' },
                { label: 'Описание', key: 'description', type: 'textarea' },
                { label: 'Ссылка (кнопка)', key: 'link', type: 'text' }
            ],
            locations: [
                { label: 'Название', key: 'title', type: 'text' },
                { label: 'Адрес', key: 'address', type: 'text' },
                { label: 'Лидер / Описание', key: 'leader', type: 'text' },
                { label: 'TG (без @)', key: 'tg', type: 'text' },
                { label: 'Широта (lat)', key: 'lat', type: 'number', id: 'f-lat' },
                { label: 'Долгота (lng)', key: 'lng', type: 'number', id: 'f-lng' }
            ],
            gallery: [
                { label: 'Тип', key: 'type', type: 'select', options: ['image', 'video'] },
                { label: 'Путь к файлу', key: 'src', type: 'text', id: 'f-src' },
                { label: 'Описание (alt)', key: 'alt', type: 'text' },
                { label: 'Размер', key: 'class', type: 'select', options: ['item-wide', 'item-small'] }
            ]
        };

        schema[currentSection].forEach(f => {
            const div = document.createElement('div');
            div.className = 'form-group';
            div.innerHTML = `<label>${f.label}</label>`;

            let input;
            if(f.type === 'select') {
                input = document.createElement('select');
                f.options.forEach(o => {
                    const opt = document.createElement('option');
                    opt.value = o; opt.innerText = o;
                    if(item[f.key] === o) opt.selected = true;
                    input.appendChild(opt);
                });
            } else if(f.type === 'textarea') {
                input = document.createElement('textarea');
                input.value = item[f.key] || '';
            } else {
                input = document.createElement('input');
                input.type = f.type;
                input.value = item[f.key] || '';
            }

            input.id = f.id || '';
            input.oninput = () => updatePreviewFromForm();
            input.dataset.key = f.key;
            div.appendChild(input);
            container.appendChild(div);
        });
    }

    function updatePreviewFromForm() {
        const item = {};
        document.querySelectorAll('#fields-container input, #fields-container textarea, #fields-container select').forEach(el => {
            item[el.dataset.key] = el.value;
        });
        updatePreview(item);
    }

    function updatePreview(item) {
        const container = document.getElementById('live-preview');
        if(currentSection === 'events') {
            container.innerHTML = `
                <div class="ev-prev">
                    <div class="date">${item.date || 'Дата не указана'}</div>
                    <h3>${item.title || 'Новое событие'}</h3>
                    <p style="font-size:12px; margin:0">${item.description || 'Описание...'}</p>
                    <div style="margin-top:10px"><button class="btn btn-sm" style="background:var(--accent); color:#111; border:none">Записаться</button></div>
                </div>`;
        } else if(currentSection === 'gallery') {
            if(item.type === 'video') {
                container.innerHTML = `<div style="text-align:center; padding:40px; border:2px dashed #444">🎥 Видеоплеер<br><small>${item.src}</small></div>`;
            } else {
                container.innerHTML = `<div class="gal-prev"><img src="${item.src || 'https://via.placeholder.com/300x150?text=No+Image'}" alt="Preview"></div>`;
            }
        } else if(currentSection === 'locations') {
            container.innerHTML = `
                <div style="background:#fff; color:#111; padding:15px; border-radius:6px;">
                    <h3 style="margin:0">${item.title || 'Название локации'}</h3>
                    <p style="margin:5px 0; font-size:13px">${item.address || 'Адрес...'}</p>
                    <div style="color:var(--primary); font-size:12px">● ${item.leader || ''}</div>
                </div>`;
        }
    }

    // --- Map Logic ---
    function initMapPicker(lat, lng) {
        if(mapPicker) mapPicker.destroy();

        ymaps.ready(() => {
            mapPicker = new ymaps.Map("map-picker", {
                center: [lat, lng],
                zoom: 13
            });

            pickerMarker = new ymaps.Placemark([lat, lng], {}, { preset: 'islands#redDotIcon', draggable: true });
            mapPicker.geoObjects.add(pickerMarker);

            // Клик по карте
            mapPicker.events.add('click', (e) => {
                const coords = e.get('coords');
                pickerMarker.geometry.setCoordinates(coords);
                updateCoords(coords[0], coords[1]);
            });

            // Перетаскивание метки
            pickerMarker.events.add('dragend', () => {
                const coords = pickerMarker.geometry.getCoordinates();
                updateCoords(coords[0], coords[1]);
            });
        });
    }

    function updateCoords(lat, lng) {
        document.getElementById('f-lat').value = lat.toFixed(6);
        document.getElementById('f-lng').value = lng.toFixed(6);
        updatePreviewFromForm();
    }

    // --- File Upload ---
    async function handleFileUpload(input) {
        const file = input.files[0];
        if(!file) return;

        const status = document.getElementById('upload-status');
        status.innerText = '⏳ Загрузка на GitHub...';

        const reader = new FileReader();
        reader.onload = async () => {
            const content = reader.result.split(',')[1]; // Base64
            const fileName = `uploads/${Date.now()}_${file.name}`;
            const token = localStorage.getItem('gh_token');

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Upload image: ${fileName}`,
                        content: content
                    })
                });

                if(res.status === 201) {
                    status.innerText = '✅ Файл загружен!';
                    const srcInput = document.getElementById('f-src');
                    if(srcInput) {
                        srcInput.value = fileName;
                        updatePreviewFromForm();
                    }
                } else {
                    throw new Error('Ошибка сервера');
                }
            } catch(e) {
                status.innerText = '❌ Ошибка: ' + e.message;
            }
        };
        reader.readAsDataURL(file);
    }

    // --- Save Actions ---
    function commitItem() {
        const item = {};
        document.querySelectorAll('#fields-container input, #fields-container textarea, #fields-container select').forEach(el => {
            let val = el.value;
            if(el.type === 'number') val = parseFloat(val);
            item[el.dataset.key] = val;
        });

        if(editIndex === -1) {
            dataCache[currentSection].items.push(item);
        } else {
            dataCache[currentSection].items[editIndex] = item;
        }

        document.getElementById('save-status').innerText = 'Есть неопубликованные изменения';
        document.getElementById('save-status').style.color = 'var(--danger)';
        switchSection(currentSection);
    }

    function removeItem(idx) {
        if(!confirm('Удалить этот элемент?')) return;
        dataCache[currentSection].items.splice(idx, 1);
        document.getElementById('save-status').innerText = 'Есть неопубликованные изменения';
        document.getElementById('save-status').style.color = 'var(--danger)';
        renderList();
    }

    async function publishAll() {
        if(!confirm('Опубликовать все изменения на сайт? Это создаст коммит в GitHub.')) return;

        const btn = document.getElementById('publish-btn');
        btn.disabled = true;
        btn.innerText = '⏳ Публикация...';

        const token = localStorage.getItem('gh_token');
        const key = currentSection;
        const finalData = currentSection === 'settings' ? dataCache[key].items : { items: dataCache[key].items };
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(finalData, null, 2))));

        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${SECTIONS[key].path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `Admin update: ${SECTIONS[key].title}`,
                    content: content,
                    sha: dataCache[key].sha
                })
            });

            if(res.status !== 200) throw new Error('Ошибка GitHub API');

            const result = await res.json();
            dataCache[key].sha = result.content.sha;

            document.getElementById('save-status').innerText = '✅ Все изменения опубликованы';
            document.getElementById('save-status').style.color = 'var(--primary)';
            alert('Успешно! Сайт обновится в течение пары минут.');
        } catch(e) {
            alert('Ошибка публикации: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '🚀 Опубликовать всё';
        }
    }

    // --- UI Helpers ---
    function showView(view) {
        ['list-view', 'editor-view', 'settings-view'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById(view + '-view').classList.remove('hidden');
    }

    function updateNav() {
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.innerText.includes(SECTIONS[currentSection].title));
        });
    }

    function cancelEdit() { showView('list'); }

    // Settings logic is simplified for this demo, same principles apply
    function renderSettings() {
        const container = document.getElementById('settings-fields');
        container.innerHTML = '';
        const data = dataCache.settings.items;
        Object.keys(data).forEach(key => {
            const div = document.createElement('div');
            div.className = 'form-group';
            div.innerHTML = `<label>${key}</label><input type="text" data-key="${key}" value="${data[key]}">`;
            container.appendChild(div);
        });
    }

    function commitSettings() {
        const data = {};
        document.querySelectorAll('#settings-fields input').forEach(el => {
            data[el.dataset.key] = el.value;
        });
        dataCache.settings.items = data;
        document.getElementById('save-status').innerText = 'Есть неопубликованные изменения';
        document.getElementById('save-status').style.color = 'var(--danger)';
    }

    if(localStorage.getItem('gh_token')) init();
</script>

</body>
</html>
