<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | ПРОСВЕТ</title>

    <!-- Идентификатор сайта в Netlify для привязки Identity -->
    <meta name="netlify-site-id" content="1467721f-3cde-4330-bbff-bce406624d2b" />

    <!-- Виджет авторизации Netlify -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      if (window.netlifyIdentity) {
        // Принудительно связываем виджет с вашим сервером Netlify
        window.netlifyIdentity.setURL("https://stunning-dango-c3132b.netlify.app/");
      }
    </script>
  </head>
  <body>
    <!-- Decap CMS загружается после настройки Identity -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
