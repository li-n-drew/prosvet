<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | ПРОСВЕТ</title>

    <meta name="netlify-site-id" content="64a07cf3-7cb8-41c1-baff-b8542092e77b" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      // Принудительно устанавливаем URL для Identity до загрузки CMS
      if (window.netlifyIdentity) {
        window.netlifyIdentity.setURL("https://sparkly-caramel-d1fc08.netlify.app/");
      }
      // Хак для CMS: записываем адрес сайта в localStorage
      localStorage.setItem("netlifySiteURL", "https://sparkly-caramel-d1fc08.netlify.app/");
    </script>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
