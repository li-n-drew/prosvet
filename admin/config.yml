backend:
  name: github
  repo: li-n-drew/prosvet
  branch: main

media_folder: "assets/uploads" # Папка, куда будут загружаться картинки
public_folder: "assets/uploads"

collections:
  - name: "content"
    label: "Контент сайта"
    files:
      - name: "settings"
        label: "Общие настройки"
        file: "_data/settings.json"
        fields:
          - { label: "Логотип (светлый)", name: "logo_light", widget: "image" }
          - { label: "Логотип (темный)", name: "logo_dark", widget: "image" }
          - { label: "Ссылка Telegram", name: "tg_url", widget: "string" }
          - { label: "Ссылка VK", name: "vk_url", widget: "string" }
          - { label: "Ссылка YouTube", name: "yt_url", widget: "string" }

      - name: "events"
        label: "Расписание (События)"
        file: "_data/events.json"
        fields:
          - name: "items"
            label: "Список событий"
            widget: "list"
            fields:
              - { label: "Дата (текст)", name: "date", widget: "string" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание (время/адрес)", name: "description", widget: "string", required: false }
              - { label: "Ссылка для записи", name: "link", widget: "string", default: "#" }

      - name: "locations"
        label: "Локации и группы"
        file: "_data/locations.json"
        fields:
          - name: "items"
            label: "Список локаций"
            widget: "list"
            fields:
              - { label: "ID (уникальный номер)", name: "id", widget: "number" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Координаты (широта, долгота)", name: "coords", widget: "list", field: { label: "Координата", name: "coord", widget: "number", value_type: "float" } }
              - { label: "Лидер (если есть)", name: "leader", widget: "string", required: false }
              - { label: "Telegram лидера (без @)", name: "tg", widget: "string", required: false }
              - { label: "Описание (если нет лидера)", name: "desc", widget: "string", required: false }
              - { label: "Адрес", name: "address", widget: "string" }

      - name: "gallery"
        label: "Галерея"
        file: "_data/gallery.json"
        fields:
          - name: "items"
            label: "Фото и видео"
            widget: "list"
            fields:
              - label: "Тип"
                name: "type"
                widget: "select"
                options: ["image", "video"]
              - { label: "Файл/Ссылка", name: "src", widget: "image" }
              - { label: "Обложка (для видео)", name: "poster", widget: "image", required: false }
              - { label: "Описание (alt)", name: "alt", widget: "string" }
              - label: "Размер"
                name: "class"
                widget: "select"
                options: 
                  - { label: "Широкий", value: "item-wide" }
                  - { label: "Обычный", value: "item-small" }
